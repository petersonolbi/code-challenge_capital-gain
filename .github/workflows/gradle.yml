name: Java
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build and Analyze
    env:
      SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'
      - run: chmod +x gradlew
      - run: ./gradlew build sonar -Dsonar.organization=petersonolbi -Dsonar.projectKey=code-challenge_capital-gain
